name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: rustup update stable --no-self-update && rustup default stable
      - name: Unit and end-to-end tests
        run: cargo test --locked
      - name: Live clipboard test under a virtual X display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q xvfb
          xvfb-run -a cargo test --locked --test clipboard_live -- --ignored --test-threads=1

  package:
    needs: test
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: ubuntu-22.04
            name: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: rustup update stable --no-self-update && rustup default stable
      - run: cargo build --release --locked
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $d = "dist/RemoteAccessCrew-${{ matrix.name }}"
          New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item target/release/rac.exe, target/release/remote-access-crew.exe, install/install.ps1, assets/remote-access-crew.ico, assets/remote-access-crew.png, README.md, LICENSE, SECURITY.md $d
          Copy-Item crew-app $d -Recurse
          Compress-Archive -Path "$d/*" -DestinationPath "dist/RemoteAccessCrew-${{ matrix.name }}.zip"
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          d=dist/RemoteAccessCrew-${{ matrix.name }}
          mkdir -p "$d"
          cp target/release/rac target/release/remote-access-crew install/install.sh assets/remote-access-crew.png README.md LICENSE SECURITY.md "$d/"
          cp -R crew-app "$d/"
          chmod +x "$d/install.sh" "$d/rac" "$d/remote-access-crew"
          tar -C dist -czf "dist/RemoteAccessCrew-${{ matrix.name }}.tar.gz" "RemoteAccessCrew-${{ matrix.name }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.name }}
          path: dist/RemoteAccessCrew-${{ matrix.name }}.*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum RemoteAccessCrew-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          printf '%s\n\n%s\n%s\n' \
            'Secure two-way text, image, and file clipboard between your machines over LAN or Tailscale.' \
            'Install: extract, then run install.ps1 (Windows) or install.sh (Linux). Verify downloads against SHA256SUMS.txt.' \
            'See README.md and SECURITY.md inside the package.' > notes.md
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "Remote Access Crew $TAG" --notes-file notes.md
