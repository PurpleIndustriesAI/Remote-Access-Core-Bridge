[package]
name = "remote-access-crew"
version = "0.7.0"
edition = "2024"
description = "Secure two-way clipboard, image, and file sharing between paired machines over LAN or Tailscale."
license-file = "LICENSE"
publish = false
build = "build.rs"

[lib]
name = "rac"
path = "src/lib.rs"

# Console CLI used for setup and scripting.
[[bin]]
name = "rac"
path = "src/bin/rac.rs"

# Windowless background bridge. It carries the app name, version, and icon on Windows.
[[bin]]
name = "remote-access-crew"
path = "src/bin/remote-access-crew.rs"

[dependencies]
anyhow = "1.0.104"
arboard = { version = "3.7.0", features = ["wayland-data-control", "image-data"] }
data-encoding = "2.11.1"
hex = "0.4.3"
hmac = "0.13.0"
if-addrs = "0.15.0"
png = "0.18.1"
rand = "0.10.3"
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "fs"] }
rustls-webpki = { version = "0.103.16", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }

[dev-dependencies]
# Signs test link messages the way a Moonlight client does (already in the lockfile via rustls).
ring = "0.17.14"

[target."cfg(windows)".dependencies]
# Microphone sharing (WASAPI). Windows only, so Linux builds need no ALSA headers.
cpal = "0.18.2"
windows-sys = { version = "0.61.2", features = ["Win32_System_DataExchange", "Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_System_Registry"] }

[target."cfg(windows)".build-dependencies]
embed-resource = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
